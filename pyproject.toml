[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aeon"
version = "0.1.0"
description = "AEON — Adaptive Economically-Optimized Network for Maximum-Efficiency AI Inference"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
full = [
    "torch>=2.0",
    "transformers>=4.30",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "httpx>=0.24",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aeon*"]

[project.scripts]
aeon = "aeon.cli.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
